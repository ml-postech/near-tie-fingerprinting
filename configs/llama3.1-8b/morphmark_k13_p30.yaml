base_model: meta-llama/Llama-3.1-8B-Instruct
watermark:
  type: kgw
  config:
    gamma: 0.5
    delta: 0.0
    seeding_scheme: simple_1
    morphmark: true
    morphmark_config:
      type: exp
      k_exp: 1.3
      p_0: 0.3
finetuning:
  dtype: bfloat16
  training_args:
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 32
    learning_rate: 2.0e-05
    max_steps: 2500
    num_train_epochs: 1
    optim: adafactor
    lr_scheduler_type: cosine
    warmup_ratio: 0.1
    logging_steps: 10
    save_strategy: 'no'
    bf16: false
    fp16: false
    gradient_checkpointing: false
    overwrite_output_dir: true
    do_train: true
  watermark_datasets:
  - LucieFr
  regularization_datasets:
  - AlpacaGPT4
  - OpenWebText
  loss_types:
  - anti-watermark-tv
  - anti-watermark-tv
  proportions:
  - 0.6
  - 0.2
  - 0.2
  lambdas:
  - 1.0
  - 1.0
  - 1.0
  streaming: true
  sequence_length: 512
  custom_name: morphmark_k13_p30
